<div class="card-carro">
  <img [src]="carro().imagem" [alt]="'Foto do carro ' + carro().modelo">
  <p class="modelo-carro">{{ carro().modelo }}</p>
  <p class="preco-carro">{{ carro().preco | currency : "BRL" : "symbol" : ".2-2" }}</p>
  <button class="botao-reservar" mat-fab extended (click)="reservarCarro(carro().id)">
    <mat-icon fontSet="material-icons-outlined">favorite</mat-icon>
    Reservar
  </button>
</div>
